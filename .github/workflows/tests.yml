name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/core.lock
      - name: Install locked core environment
        run: |
          python -m pip install --require-hashes -r requirements/core.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Run core and offline integration tests
        run: make test PYTHON=python
      - name: Run persistent offline example
        run: python quant-method/alphacrafter/run_offline_example.py --output-dir /tmp/alphax-example

  optional:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: llm
            python-version: "3.13"
          - environment: qlib
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/${{ matrix.environment }}.lock
      - name: Install optional locked environment
        run: |
          python -m pip install --require-hashes -r requirements/core.lock
          python -m pip install --no-build-isolation --require-hashes -r requirements/${{ matrix.environment }}.lock
          python -m pip install --no-deps --no-build-isolation -e '.[${{ matrix.environment }}]'
          python -m pip check
      - name: Exercise real libraries with synthetic data
        run: make test-${{ matrix.environment }} PYTHON=python

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/dev.lock
      - run: python -m pip install --require-hashes -r requirements/dev.lock
      - run: make lint PYTHON=python
