name: Core tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/core.lock
      - name: Install locked core environment
        run: |
          python -m pip install --require-hashes -r requirements/core.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Run core and offline integration tests
        run: make test PYTHON=python
