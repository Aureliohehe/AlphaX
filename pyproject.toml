[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alphax-research"
version = "0.1.0"
description = "Reproducible factor research with Miner, Screener and Trader workflows"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy>=2.2,<2.3",
    "pandas>=2.3,<2.4",
    "scipy>=1.15,<1.16",
    "typing-extensions>=4.15,<5",
]

[project.optional-dependencies]
llm = ["langgraph==1.2.2", "litellm==1.81.0"]
qlib = ["pyqlib==0.9.7", "xgboost==3.4.1"]
dev = ["ruff==0.14.10"]

# Keep the package next to the scripts so direct CLI invocation also works.
[tool.setuptools]
packages = ["alphax"]
package-dir = {alphax = "quant-method/alphacrafter/alphax"}

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Start with syntax/control-flow errors and undefined names; formatting is separate.
select = ["E9", "F63", "F7", "F82"]
